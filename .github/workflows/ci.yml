name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests and examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

        # FFmpeg for media decode/encode; LibRaw (dcraw_emu) for camera RAW; xmllint validates exported FCPXML.
      # Mesa's llvmpipe / lavapipe lets the GPU parity test run Chromium's ANGLE Vulkan and EGL backends without a GPU.
      - name: Install FFmpeg, LibRaw, xmllint and Mesa
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libraw-bin libxml2-utils mesa-vulkan-drivers libegl-mesa0 libegl1

      # OpenTimelineIO cross-checks exported/imported timelines (those tests skip without it).
      - name: Install OpenTimelineIO
        run: python3 -m pip install --user --break-system-packages OpenTimelineIO-Plugins

      # Chromium for headless rendering, pinned to the playwright-core version the CLI depends on.
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tasweerix/cli exec playwright-core install chromium

      - name: Install Chromium system dependencies
        run: pnpm --filter @tasweerix/cli exec playwright-core install-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Render examples
        run: pnpm examples

      # Packs every package as `pnpm publish` would and checks the tarballs work outside the monorepo.
      - name: Check packed packages
        run: bash scripts/check-packed.sh
